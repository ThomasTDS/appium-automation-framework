name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-tests:
    name: Testes Android (Appium + WebdriverIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Baixar APK do aplicativo sob teste (Sauce Labs My Demo App)
        run: |
          mkdir -p ./apps
          curl -L -o ./apps/android-demo-app.apk \
            "https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk"

      - name: Habilitar KVM para o emulador Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rodar a suite de testes no emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: medium_phone
          disable-animations: true
          script: npm test

      - name: Gerar relatorio Allure
        if: always()
        run: npm run report:generate

      - name: Publicar relatorio Allure como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          retention-days: 30
