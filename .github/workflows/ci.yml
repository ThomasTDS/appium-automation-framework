name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Qualidade de codigo (lint, formatacao, tipos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatacao (Prettier)
        run: npm run format:check

      - name: Checagem de tipos (TypeScript)
        run: npm run typecheck

      # Nao bloqueia o build: ha vulnerabilidades conhecidas em dependencias
      # transitivas de pacotes do WebdriverIO (ver internal-docs/DECISOES.md,
      # entrada "Estrutura base do framework implementada"), aceitas
      # conscientemente por serem usadas so em tempo de desenvolvimento/teste,
      # nunca em codigo de producao. Esta etapa mantem o resultado visivel no
      # log do CI para acompanhamento, sem reabrir essa decisao a cada PR.
      - name: Auditoria de vulnerabilidades (informativo)
        run: npm audit --audit-level=high
        continue-on-error: true

  android-tests:
    name: Testes Android (Appium + WebdriverIO) - shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Baixar APK do aplicativo sob teste (Sauce Labs My Demo App)
        run: |
          mkdir -p ./apps
          curl -L -o ./apps/android-demo-app.apk \
            "https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk"

      - name: Habilitar KVM para o emulador Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cada shard roda num emulador/runner independente, dividindo os
      # arquivos .feature entre si via --shard do WebdriverIO (ver
      # internal-docs/DECISOES.md). O numero total de shards precisa bater
      # com o tamanho de matrix.shard acima.
      - name: Rodar a suite de testes no emulador Android (shard ${{ matrix.shard }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: medium_phone
          disable-animations: true
          script: npx wdio run ./wdio.conf.ts --shard ${{ matrix.shard }}/3

      - name: Publicar resultados brutos do Allure deste shard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-shard-${{ matrix.shard }}
          path: allure-results
          retention-days: 1

      # So existe conteudo aqui numa tag de baseline visual nova (ver
      # test/visual-baseline/README.md) - o workflow precisa aceitar rodar
      # sem esse artefato quando nao houver nada novo a publicar. O
      # cenario de regressao visual roda num unico shard (qualquer um), por
      # isso cada shard sobe seu proprio artefato nomeado individualmente,
      # mesmo que a maioria fique vazia.
      - name: Publicar baseline visual gerada neste shard (se houver)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baseline-shard-${{ matrix.shard }}
          path: test/visual-baseline
          if-no-files-found: ignore
          retention-days: 7

  merge-allure-report:
    name: Combinar resultados dos shards e gerar relatorio Allure
    needs: android-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Junta os resultados brutos de todos os shards numa unica pasta antes
      # de gerar o relatorio - o Allure agrega qualquer conjunto de arquivos
      # de resultado encontrado no diretorio, independente de qual shard os
      # produziu.
      - name: Baixar e combinar resultados de todos os shards
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-shard-*
          path: allure-results
          merge-multiple: true

      # So existe conteudo aqui numa tag de baseline visual nova (ver
      # test/visual-baseline/README.md) - o workflow precisa aceitar rodar
      # sem esse artefato quando nao houver nada novo a publicar.
      - name: Publicar baseline visual gerada (se houver)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baseline
          path: test/visual-baseline
          if-no-files-found: ignore
          retention-days: 7

      # Copia o historico de execucoes anteriores (publicado no GitHub Pages)
      # para dentro de allure-results/history antes de gerar o relatorio - e
      # assim que o Allure sabe montar o grafico de tendencia (Trend) entre
      # execucoes. Cada arquivo e baixado individualmente porque a primeira
      # publicacao do projeto (ou a primeira apos limpar o historico) nao tem
      # nenhum desses arquivos ainda - um 404 por arquivo e esperado nesse
      # caso, e nao deve interromper o restante do workflow.
      - name: Baixar historico anterior do Allure (GitHub Pages)
        if: always()
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json categories-trend.json duration-trend.json retry-trend.json; do
            curl -fsSL -o "allure-results/history/$f" \
              "https://thomastds.github.io/appium-automation-framework/history/$f" \
              || { echo "Sem historico anterior para $f (normal na primeira publicacao)."; rm -f "allure-results/history/$f"; }
          done

      - name: Gerar relatorio Allure
        if: always()
        run: npm run report:generate

      - name: Publicar relatorio Allure como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

  publish-report:
    name: Publicar relatorio Allure no GitHub Pages
    needs: merge-allure-report
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar relatorio Allure gerado no job anterior
        uses: actions/download-artifact@v8
        with:
          name: allure-report
          path: allure-report

      - name: Preparar artefato para o GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
